name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The browser is a hard Windows dependency: src/cdp.js looks for
    # msedge.exe at fixed Program Files paths, and the test suites drive a
    # real headless Edge over CDP.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Edge
        uses: microsoft/setup-msedge@v2

      - name: Show the browser under test
        shell: pwsh
        run: |
          $edge = @(
            "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw "msedge.exe not found on this runner" }
          Write-Host "Edge: $edge"
          & $edge --version

      - run: npm ci

      # The live suite drives bing and zhihu over the network, so it is not
      # part of CI. --no-live keeps the offline suites and skips the rest.
      - name: Test
        run: npm run test:offline
